      font-weight: 700;
      border-radius: 14px;

      border-radius: 20px;
      padding: 32px;
      margin-bottom: 40px;

      color: var(--gold);

    }
    
    .pour-timeline {

      border-radius: 14px;
      padding: 24px;
      margin: 24px 0;
    }
    
    .pour-step {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
      align-items: flex-start;
    }
    
    .pour-time {

      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 70px;
      text-align: center;

      padding: 16px;
      margin-bottom: 12px;
      font-size: 0.9rem;

    .mini-card:hover {
      border-color: var(--gold);
    }
    
    .flavour-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    
    .flavour-item {
      background: #1f1f1f;
      padding: 16px;
      border-radius: 12px;
    }
    
    .thermal-guide {

      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
    }

      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    
    .thermal-icon {
      width: 42px;
      text-align: center;
      font-size: 1.4rem;

    /* SAVED RECIPES */

      gap: 20px;
    }
    
    .saved-card {

      border: 1px solid #333;
      border-radius: 16px;
      padding: 22px;
    }

      align-items: flex-start;
      margin-bottom: 14px;
    }

      gap: 8px;
    }

      font-size: 0.8rem;
      border-radius: 8px;
      border: 1px solid #555;
      background: transparent;
      color: #ccc;
      cursor: pointer;
    }
    
    .btn-small:hover {
      border-color: var(--gold);
      color: var(--gold);

        bloom = "40g / 40 sec";
        pourSteps = [
          {time: "00:00", text: "Bloom — 40g, 40 seconds"},
          {time: "00:40", text: "Pour 1 — 110g, centre"},
          {time: "01:40", text: "Pour 2 — 127g, slow spiral"},
          {time: "03:10", text: "Drawdown begins"}
        ];
      } else if (brewMethod.includes("Hario Alpha") || brewMethod.includes("Flatbed")) {
        totalTime = "~3:05";
        bloom = "30g / 30 sec";
        pourSteps = [
          {time: "00:00", text: "Bloom — 30g, 30 seconds"},
          {time: "00:30", text: "Pour 1 — 95g, centre spiral"},
          {time: "01:30", text: "Pour 2 — 100g, slow steady"},
          {time: "03:05", text: "Target complete"}
        ];
      } else {
        // Default V60 style
        totalTime = "~3:00";
        bloom = "30g / 30 sec";
        pourSteps = [
          {time: "00:00", text: "Bloom — 30g, 30 seconds, gentle swirl"},
          {time: "00:30", text: "Pour 1 — 90g, centre spiral"},
          {time: "01:30", text: "Pour 2 — 105g, slow steady to edges"},
          {time: "03:00", text: "Drawdown complete"}
        ];
      }
      
      // Flavour Profile Prediction
      if (origin === "Colombia" && varietal.includes("Gesha")) {
        flavour = {acid: "Citric + Malic", body: "Medium-Light", finish: "Sweet & Lingering", watch: "Orange blossom + nectarine honey transition"};
      } else if (origin === "Ethiopia" && process.includes("Natural")) {
        flavour = {acid: "Phosphoric", body: "Light", finish: "Clean", watch: "Berry + floral dominance"};
      } else if (process.includes("Anaerobic")) {
        flavour = {acid: "Malic dominant", body: "Full", finish: "Lingering", watch: "Savory esters + fruit layering"};
      } else if (varietal.includes("Wush Wush")) {
        flavour = {acid: "Citric", body: "Light", finish: "Tea-like", watch: "Delicate floral clarity"};
      } else {
        flavour = {acid: "Balanced Malic/Citric", body: "Medium", finish: "Clean", watch: "Classic origin expression"};
      }
      
      // Thermal Phase Guide
      thermal = [
        {icon: "🔥", phase: "Hot (0–30s)", note: "Brightest acids + top notes (jasmine, citrus zest)"},
        {icon: "🌡️", phase: "Mid (30–90s)", note: "Body develops, sweetness emerges, mid-palate fruit"},
        {icon: "❄️", phase: "Cool (90s+)", note: "Finish resolves — honey, chocolate, or tea-like aftertaste"}
      ];
      
      // Render Output
      renderOutput(dose, yieldG, ratio, temp, bloom, totalTime, pourSteps, tempLogic, ratioLogic, flavour, thermal, origin, varietal, process, brewMethod, roastAge);
      
      // Find similar entries
      findSimilarEntries(origin, varietal, process, brewMethod);
      
      document.getElementById('output-panel').classList.add('active');
      document.getElementById('output-panel').scrollIntoView({ behavior: 'smooth' });
    }
    
    function renderOutput(dose, yieldG, ratio, temp, bloom, totalTime, pourSteps, tempLogic, ratioLogic, flavour, thermal, origin, varietal, process, brewMethod, roastAge) {
      // Parameters
      const paramsHTML = `
        <div class="param"><div class="param-label">DOSE</div><div class="param-value">${dose}g</div></div>
        <div class="param"><div class="param-label">YIELD</div><div class="param-value">${yieldG}g</div></div>
        <div class="param"><div class="param-label">RATIO</div><div class="param-value">${ratio}</div></div>
        <div class="param"><div class="param-label">TEMP</div><div class="param-value">${temp}</div></div>
        <div class="param"><div class="param-label">BLOOM</div><div class="param-value">${bloom}</div></div>
        <div class="param"><div class="param-label">TIME</div><div class="param-value">${totalTime}</div></div>
      `;
      document.getElementById('params-grid').innerHTML = paramsHTML;
      
      // Pour Structure
      let pourHTML = '';
      pourSteps.forEach(step => {
        pourHTML += `<div class="pour-step"><div class="pour-time">${step.time}</div><div>${step.text}</div></div>`;
      });
      document.getElementById('pour-structure').innerHTML = pourHTML;
      
      // Logic
      document.getElementById('temp-logic').innerHTML = tempLogic;
      document.getElementById('ratio-logic').innerHTML = ratioLogic;
      
      // Flavour
      const flavourHTML = `
        <div class="flavour-item"><strong>Acid Type</strong><br>${flavour.acid}</div>
        <div class="flavour-item"><strong>Body</strong><br>${flavour.body}</div>
        <div class="flavour-item"><strong>Finish</strong><br>${flavour.finish}</div>
        <div class="flavour-item"><strong>Watch For</strong><br>${flavour.watch}</div>
      `;
      document.getElementById('flavour-profile').innerHTML = flavourHTML;
      
      // Thermal Guide
      let thermalHTML = '';
      thermal.forEach(t => {
        thermalHTML += `<div class="thermal-row"><div class="thermal-icon">${t.icon}</div><div><strong>${t.phase}</strong><br><span style="color:#aaa;">${t.note}</span></div></div>`;
      });
      document.getElementById('thermal-guide').innerHTML = thermalHTML;
    }
    
    // ==================== ARCHIVE MATCHING ====================
    function findSimilarEntries(origin, varietal, process, brewMethod) {
      let matches = [];
      
      archive.forEach(entry => {
        let score = 0;
        if (entry.varietal === varietal && varietal !== "Unknown") score += 40;
        if (entry.process === process) score += 30;
        if (entry.brew_method.includes(brewMethod.split(' ')[0])) score += 20;
        if (entry.date.includes("2026-05") || entry.date.includes("2026-04")) score += 10; // recent bias
        
        if (score > 30) {
          matches.push({...entry, score});
        }
      });
      
      matches.sort((a, b) => b.score - a.score);
      matches = matches.slice(0, 3);
      
      let html = `<p style="color:#888; margin-bottom:12px;">${matches.length} similar entries found in archive</p>`;
      
      matches.forEach(m => {
        html += `
          <div class="mini-card">
            <strong>${m.coffee}</strong> — ${m.cafe}<br>
            <span style="color:#888; font-size:0.85rem;">${m.date} • ${m.process} • ${m.ratio}</span><br>
            <em style="color:#c9a84c;">"${m.verdict.substring(0, 90)}..."</em>
          </div>
        `;
      });
      
      if (matches.length === 0) {
        html = `<p style="color:#666;">No exact matches found. Your combination is unique in the current archive.</p>`;
      }
      
      document.getElementById('archive-matches').innerHTML = html;
    }
    
    // ==================== SAVE / LOAD RECIPES ====================
    function saveRecipe() {
      const name = prompt("Name this recipe (e.g. 'FLUID El Obraje 1:15.3'):");
      if (!name) return;
      
      const recipe = {
        id: Date.now(),
        name: name,
        date: new Date().toISOString().split('T')[0],
        origin: document.getElementById('origin').value,
        varietal: document.getElementById('varietal').value,
        process: document.getElementById('process').value,
        brewMethod: document.getElementById('brew-method').value,
        roastAge: document.getElementById('roast-age').value,
        dose: document.querySelector('#params-grid .param-value').textContent || "15g",
        ratio: document.querySelectorAll('#params-grid .param-value')[2]?.textContent || "1:15"
      };
      
      let saved = JSON.parse(localStorage.getItem('hari_brew_recipes') || '[]');
      saved.unshift(recipe);
      localStorage.setItem('hari_brew_recipes', JSON.stringify(saved));
      
      alert("Recipe saved successfully!");
      showSavedRecipes();
    }
    
    function showSavedRecipes() {
      const container = document.getElementById('saved-grid');
      container.innerHTML = '';
      
      let saved = JSON.parse(localStorage.getItem('hari_brew_recipes') || '[]');
      
      if (saved.length === 0) {
        container.innerHTML = `<p style="color:#666; grid-column: 1 / -1;">No saved recipes yet. Calculate and save one above!</p>`;
        return;
      }
      
      saved.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'saved-card';
        card.innerHTML = `
          <div class="saved-header">
            <div>
              <strong>${recipe.name}</strong><br>
              <span style="font-size:0.8rem; color:#888;">${recipe.date}</span>
            </div>
            <div class="saved-actions">
              <button class="btn-small" onclick="loadRecipe(${recipe.id})">Load</button>
              <button class="btn-small" onclick="deleteRecipe(${recipe.id}, this)">Delete</button>
            </div>
          </div>
          <div style="font-size:0.85rem; color:#aaa;">
            ${recipe.origin} • ${recipe.varietal} • ${recipe.process}<br>
            ${recipe.brewMethod} • ${recipe.roastAge} days old
          </div>
        `;
        container.appendChild(card);
      });
    }
    
    function loadRecipe(id) {
      let saved = JSON.parse(localStorage.getItem('hari_brew_recipes') || '[]');
      const recipe = saved.find(r => r.id === id);
      if (!recipe) return;
      
      document.getElementById('origin').value = recipe.origin;
      document.getElementById('varietal').value = recipe.varietal;
      document.getElementById('process').value = recipe.process;
      document.getElementById('brew-method').value = recipe.brewMethod;
      document.getElementById('roast-age').value = recipe.roastAge;
      
      // Trigger calculation
      calculateRecipe();
      
      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function deleteRecipe(id, btn) {
      if (!confirm("Delete this saved recipe?")) return;
      
      let saved = JSON.parse(localStorage.getItem('hari_brew_recipes') || '[]');
      saved = saved.filter(r => r.id !== id);
      localStorage.setItem('hari_brew_recipes', JSON.stringify(saved));
      
      btn.closest('.saved-card').remove();
    }
    
    // ==================== SLIDER & INIT ====================
    function initSlider() {
      const slider = document.getElementById('roast-age');
      const valueDisplay = document.getElementById('roast-value');
      
      slider.addEventListener('input', () => {
        valueDisplay.textContent = slider.value;
        
        // Dynamic color feedback
        const val = parseInt(slider.value);
        if (val <= 7) {
          valueDisplay.style.color = '#e74c3c';
        } else if (val <= 25) {
          valueDisplay.style.color = '#f1c40f';
        } else {
          valueDisplay.style.color = '#e74c3c';
        }
      });
      
      // Initial value
      valueDisplay.textContent = slider.value;
    }
    
    function init() {
      initSlider();
      showSavedRecipes();
      
      // Demo: Auto-fill a popular entry on load (optional)
      console.log('%c[Hari Coffee Archive] Brew Calculator initialized with 31-entry archive.', 'color:#c9a84c');
    }
    
    window.onload = init;
  </script>
  
  <!-- Activate shared navigation -->
  <script src="nav.js"></script>
